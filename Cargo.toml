[workspace]
members = ["crates/*", "xtask", "third_party/purcore"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.7"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
purcore = { path = "third_party/purcore", version = "=0.1.0-mothref.1" }
moth-scene = { path = "crates/moth-scene", version = "0.1.0-alpha.7" }
moth-format = { path = "crates/moth-format", version = "0.1.0-alpha.7" }
moth-io = { path = "crates/moth-io", version = "0.1.0-alpha.7" }
moth-render = { path = "crates/moth-render", version = "0.1.0-alpha.7" }
moth-ui = { path = "crates/moth-ui", version = "0.1.0-alpha.7" }
moth-platform = { path = "crates/moth-platform", version = "0.1.0-alpha.7" }
moth-import = { path = "crates/moth-import", version = "0.1.0-alpha.7" }
anyhow = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
uuid = { version = "1", features = ["v7"] }
fractional_index = "2"
rstar = "0.12"
proptest = "1"
wgpu = "30"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
egui = { version = "0.36.2", default-features = false }
egui-wgpu = "0.36.2"
egui-winit = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
crossbeam-channel = "0.5"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
png = "0.18"
gif = "0.14"
# Rayon processes baseline rows inline instead of queuing unbounded coefficient buffers.
jpeg-decoder = { version = "0.3", default-features = false, features = ["rayon"] }
arboard = { version = "3", features = ["wayland-data-control"] }
rfd = "0.17"

[profile.dev.package."*"]
opt-level = 3
