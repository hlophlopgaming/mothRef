[package]
name = "moth-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
moth-format.workspace = true
blake3.workspace = true
image.workspace = true
jpeg-decoder.workspace = true
png.workspace = true
gif.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
tracing.workspace = true

[dev-dependencies]
dhat = "0.3"
bcdec_rs = "0.2"

# BC7 is a desktop-GPU format; the Intel ISPC encoder's kernels are x86/x86_64
# only. Mobile targets fall back to RGBA8 (and later ASTC), so the dependency
# is gated off the aarch64-linux-android core check.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
intel_tex_2 = "0.5"

# The core check needs no Android NDK; desktop builds keep SIMD enabled.
[target.'cfg(target_os = "android")'.dependencies]
blake3 = { workspace = true, features = ["pure"] }
