[package]
name = "moth-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
moth-format.workspace = true
winit.workspace = true
arboard.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
moth-io.workspace = true
uuid.workspace = true
blake3.workspace = true
moth-scene.workspace = true
moth-import.workspace = true
ctrlc = { version = "3.5", features = ["termination"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring"] }
scraper = { version = "0.27", default-features = false }
url = "2"
rustls-native-certs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Globalization"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server"] }
