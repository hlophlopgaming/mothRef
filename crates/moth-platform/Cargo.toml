[package]
name = "moth-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
moth-format.workspace = true
winit.workspace = true
arboard.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
moth-io.workspace = true
uuid.workspace = true
blake3.workspace = true
moth-scene.workspace = true
moth-import.workspace = true
ctrlc = { version = "3.5", features = ["termination"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring"] }
scraper = { version = "0.27", default-features = false }
url = "2"
rustls-native-certs = "0.8"

base64 = "0.23"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_UI_Input_Pointer", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_Media_Audio"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xkb"] }
rustix = { version = "1", features = ["event"] }
# Links the system libdbus-1 (libdbus-1-dev to build).
dbus = "0.9"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
global-hotkey = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "NSRunningApplication", "NSSound"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSDictionary", "NSString", "NSOperation", "NSData"] }
block2 = "0.6"
