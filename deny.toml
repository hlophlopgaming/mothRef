[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = ["GPL-3.0-or-later", "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "OFL-1.1", "BSL-1.0"]

[[licenses.exceptions]]
name = "mozjpeg"
allow = ["IJG"]

[[licenses.exceptions]]
name = "mozjpeg-sys"
allow = ["IJG"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
