[advisories]
yanked = "deny"
ignore = [
    # chrono is unmaintained (no fixed version). It comes only from `trash`,
    # which uses it to write Linux trash info dates; no chrono-free `trash` release exists.
    { id = "RUSTSEC-2026-0543", reason = "chrono via trash only; no maintained alternative release of trash yet" },
]

[licenses]
confidence-threshold = 0.93
allow = ["GPL-3.0-or-later", "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "OFL-1.1", "BSL-1.0"]

[[licenses.exceptions]]
name = "mozjpeg"
allow = ["IJG"]

[[licenses.exceptions]]
name = "mozjpeg-sys"
allow = ["IJG"]

[[licenses.exceptions]]
# The fuzz workspace links the NCSA-licensed LLVM libFuzzer runtime.
name = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
