[package]
name = "mothref-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
purcore = { path = "../third_party/purcore", version = "=0.1.0-mothref.1" }
libfuzzer-sys = "0.4"
moth-io = { path = "../crates/moth-io", version = "0.3.0-alpha.2" }
moth-format = { path = "../crates/moth-format", version = "0.3.0-alpha.2" }
moth-import = { path = "../crates/moth-import", version = "0.3.0-alpha.2" }

[[bin]]
name = "image_reader"
path = "fuzz_targets/image_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "moth_reader"
path = "fuzz_targets/moth_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bee_reader"
path = "fuzz_targets/bee_reader.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[patch.crates-io]
rav1d = { path = "../third_party/rav1d" }

[[bin]]
name = "pur_reader"
path = "fuzz_targets/pur_reader.rs"
test = false
doc = false
bench = false
