# SPDX-License-Identifier: GPL-3.0-or-later
name: mothref
arch: amd64
platform: linux
version: ${MOTHREF_VERSION}
maintainer: MothRef contributors <hlophlopgaming@users.noreply.github.com>
description: Native reference boards for artists
homepage: https://github.com/hlophlopgaming/mothRef
license: GPL-3.0-or-later
contents:
  - src: package/mothref
    dst: /usr/bin/mothref
  - src: packaging/linux/org.mothref.MothRef.desktop
    dst: /usr/share/applications/org.mothref.MothRef.desktop
  - src: packaging/linux/org.mothref.MothRef.xml
    dst: /usr/share/mime/packages/org.mothref.MothRef.xml
  - src: docs/assets/icon/mothref-icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/org.mothref.MothRef.png
  - src: package/LICENSE*
    dst: /usr/share/licenses/mothref/
  - src: THIRD_PARTY.md
    dst: /usr/share/doc/mothref/THIRD_PARTY.md
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgcc-s1
      - libstdc++6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libxcursor1
      - libxi6
      - libxrandr2
      - libwayland-client0
      - libdbus-1-3
    recommends: [libvulkan1, libegl1, xdg-desktop-portal]
  rpm:
    depends:
      - glibc >= 2.39
      - libgcc
      - libstdc++
      - libxkbcommon
      - libxkbcommon-x11
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - libwayland-client
      - dbus-libs
    recommends: [vulkan-loader, libglvnd-egl, xdg-desktop-portal]
