name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Report clippy diagnostics as annotations
        if: failure()
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 \
            | grep -E '(^|: )(error|warning)' | grep -v 'could not compile' | head -40 \
            | sed -E 's/^/::error::/' || true
      - run: cargo test --workspace
      - run: cargo xtask corpus
      - if: runner.os == 'Linux'
        run: cargo xtask killtest 1000
      - run: cargo xtask bench --quick
      - name: Check software rendering where a fallback adapter is installed
        if: runner.os == 'Linux'
        run: cargo xtask bench --quick --software
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  android-core:
    # Pinned: the Android SDK installer broke when ubuntu-latest moved to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # The NDK is downloaded directly; no SDK manager or Java is needed for cargo check.
      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Use the NDK C toolchain for the streaming JPEG decoder
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          bin="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android24-clang"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check --target aarch64-linux-android -p moth-scene -p moth-format -p moth-io
