name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package matching sources and Arch recipe
        run: python3 packaging/release.py source
      - uses: actions/upload-artifact@v4
        with:
          name: mothref-source
          path: dist/*
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev cmake libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 rpm desktop-file-utils
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        run: sudo apt-get install -y yasm
      # Linux uses the distro's Yasm; libaom 3.11 rejects NASM 3 help output.
      - uses: ilammy/setup-nasm@v1
        if: runner.os != 'Linux'
        with:
          version: '2.16.03'
          from-source: ${{ runner.os != 'Windows' }}
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux' && runner.arch == 'X64'
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install DEB and RPM packaging tool
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
      - name: Install native AppImage packaging tool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 -o linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-$(uname -m).AppImage"
          chmod +x linuxdeploy.AppImage
      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$RELEASE_TAG" = "v$version"
      - run: cargo build --locked --release -p mothref --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
          MACOSX_DEPLOYMENT_TARGET: '11.0'
      - name: Stage archives and native packages
        run: python packaging/release.py native --target ${{ matrix.target }} --name ${{ matrix.name }}
      - name: Build and check native AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LDAI_OUTPUT: mothref-${{ matrix.name }}.AppImage
        run: |
          mkdir -p AppDir/usr/share/mime/packages AppDir/usr/share/licenses/mothref
          cp packaging/linux/org.mothref.MothRef.xml AppDir/usr/share/mime/packages/
          cp package/LICENSE* package/THIRD_PARTY.md AppDir/usr/share/licenses/mothref/
          libdir="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          # Winit loads these with dlopen, so ELF dependency discovery misses them.
          ./linuxdeploy.AppImage --appdir AppDir --executable package/mothref --desktop-file packaging/linux/org.mothref.MothRef.desktop --icon-file package/org.mothref.MothRef.png --library "$libdir/libxkbcommon-x11.so.0" --library "$libdir/libXcursor.so.1" --library "$libdir/libXi.so.6" --library "$libdir/libXrandr.so.2" --output appimage
          mv "$LDAI_OUTPUT" dist/
          desktop-file-validate package/org.mothref.MothRef.desktop
          "dist/$LDAI_OUTPUT" --help
      - name: Inspect, install and remove DEB and RPM packages
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: |
          dpkg-deb --info dist/mothref-linux-x86_64.deb
          dpkg-deb --contents dist/mothref-linux-x86_64.deb
          rpm -qp --requires dist/mothref-linux-x86_64.rpm
          rpm -qpl dist/mothref-linux-x86_64.rpm
          sudo apt-get install -y ./dist/mothref-linux-x86_64.deb
          /usr/bin/mothref --help
          sudo apt-get remove -y mothref
          docker run --rm --volume "$PWD/dist:/packages:ro" fedora:42 bash -ec 'dnf install -y /packages/mothref-linux-x86_64.rpm; mothref --help; rpm -e mothref; test ! -e /usr/bin/mothref'
      - name: Build Windows setup wizard
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])'
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" packaging/windows/mothref.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $install = Join-Path $env:RUNNER_TEMP 'MothRef install check'
          $setup = Start-Process dist/mothref-windows-x86_64-setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$install`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path "$install/mothref.exe")) { throw "Setup installation failed" }
          $uninstall = Start-Process "$install/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$install/mothref.exe")) { throw "Setup uninstallation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: mothref-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
  arch:
    needs: source
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm git rust cmake yasm libxkbcommon libxkbcommon-x11 libx11 libxcursor libxi libxrandr wayland dbus sudo
      - uses: actions/download-artifact@v4
        with:
          name: mothref-source
          path: /tmp/mothref-arch
      - name: Build pacman package as an unprivileged user
        working-directory: /tmp/mothref-arch
        run: |
          tar -xzf mothref-arch-build.tar.gz
          useradd --create-home builder
          chown -R builder:builder /tmp/mothref-arch
          su builder -c 'cd /tmp/mothref-arch && makepkg --noconfirm'
          pacman -U --noconfirm ./*.pkg.tar.zst
          mothref --help
          pacman -R --noconfirm mothref
          test ! -e /usr/bin/mothref
      - uses: actions/upload-artifact@v4
        with:
          name: mothref-arch
          path: |
            /tmp/mothref-arch/*.pkg.tar.zst
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - name: Require passing CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" && test "$run_id" != "null"
          gh run watch "$run_id" --exit-status --interval 15
      - name: Attach binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 packaging/verify.py binaries
          (cd binaries && sha256sum * > SHA256SUMS)
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "MothRef $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" binaries/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$notes"
