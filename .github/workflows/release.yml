name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "mothref"))')
          test "$RELEASE_TAG" = "v$version"
      - run: cargo build --locked --release -p mothref --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/mothref package/
          cp LICENSE THIRD_PARTY.md crates/moth-ui/fonts/LICENSE-*.txt package/
          tar -czf mothref-${{ matrix.name }}.tar.gz -C package .
      - name: Package Finder application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p package/MothRef.app/Contents/MacOS
          cp target/${{ matrix.target }}/release/mothref package/MothRef.app/Contents/MacOS/
          cp LICENSE THIRD_PARTY.md crates/moth-ui/fonts/LICENSE-*.txt package/
          python3 - <<'PYTHON'
          import json, plistlib, subprocess
          from pathlib import Path
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--format-version', '1']))
          version = next(p['version'] for p in metadata['packages'] if p['name'] == 'mothref')
          info = dict(CFBundleExecutable='mothref', CFBundleIdentifier='org.mothref.MothRef',
                      CFBundleName='MothRef', CFBundlePackageType='APPL',
                      CFBundleShortVersionString=version.split('-')[0], CFBundleVersion='1',
                      NSHighResolutionCapable=True)
          destination = Path('package/MothRef.app/Contents/Info.plist')
          destination.write_bytes(plistlib.dumps(info))
          assert plistlib.loads(destination.read_bytes())['CFBundleExecutable'] == 'mothref'
          assert (destination.parent / 'MacOS' / 'mothref').stat().st_mode & 0o111
          PYTHON
          plutil -lint package/MothRef.app/Contents/Info.plist
          tar -czf mothref-${{ matrix.name }}.tar.gz -C package .
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import pathlib,struct; p=pathlib.Path('target/${{ matrix.target }}/release/mothref.exe').read_bytes(); pe=struct.unpack_from('<I',p,0x3c)[0]; assert p[pe:pe+4]==b'PE\0\0'; assert struct.unpack_from('<H',p,pe+24+68)[0]==2, 'Expected GUI subsystem'"
          New-Item -ItemType Directory package
          Copy-Item target/${{ matrix.target }}/release/mothref.exe package/
          Copy-Item LICENSE, THIRD_PARTY.md, crates/moth-ui/fonts/LICENSE-*.txt package/
          Compress-Archive package/* mothref-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mothref-${{ matrix.name }}
          path: mothref-${{ matrix.name }}.*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - name: Require passing CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" && test "$run_id" != "null"
          gh run watch "$run_id" --exit-status --interval 15
      - name: Attach binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(find binaries -maxdepth 1 -type f | wc -l)" -eq 4
          (cd binaries && sha256sum * > SHA256SUMS)
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "MothRef $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" binaries/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$notes"
